# default shellをzshへ
set-option -g default-shell /bin/zsh

# prefixキーをC-tに変更する（好み）
set -g prefix C-t

# C-bのキーバインドを解除する
unbind C-b

# キーストロークのディレイを減らす
set -sg escape-time 0

# マウス操作を有効にする（スクロール・ペイン切り替え）
set -g mouse on

# ウィンドウのインデックスを1から始める
set -g base-index 1

# ペインのインデックスを1から始める
setw -g pane-base-index 1

# 設定ファイルをリロードする
#bind r source-file ~/.tmux.conf \; display "Reloaded!"

# C-a*2でtmux内のプログラムにC-aを送る
bind C-t send-prefix

# | でペインを縦に分割する
bind | split-window -h

# - でペインを横に分割する
bind - split-window -v

# 256色端末を使用する（tmux-256color はマウス等のモダンな機能をサポート）
set -g default-terminal "tmux-256color"

# ステータスバーの色を設定する
set -g status-fg white
set -g status-bg black

# ウィンドウリストの色を設定する
setw -g window-status-style fg="cyan"
setw -g window-status-style bg="default"
setw -g window-status-style "dim"
# アクティブなウィンドウを目立たせる
setw -g window-status-current-style fg="white"
setw -g window-status-current-style bg="red"
setw -g window-status-current-style "bright"

# ペインボーダーの色を設定する
set -g pane-border-style 'fg=colour240'
# アクティブなペインを目立たせる（tmuxデフォルトの緑）
set -g pane-active-border-style 'fg=green'

# 非アクティブペインを薄暗くする
set -g window-style 'bg=colour235'
set -g window-active-style 'bg=black'

# ペインタイトルバーを上部に表示
set -g pane-border-status top
set -g pane-border-format " #{pane_id} #{pane_title} "

# コマンドラインの色を設定する
set -g message-style fg="white"
set -g message-style bg="black"
set -g message-style "bright"

# ステータスバーを設定する
## 左パネルを設定する
set -g status-left-length 40
set -g status-left "#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P"
## 右パネルを設定する
set -g status-right "#[fg=cyan][%Y-%m-%d(%a) %H:%M]"
## リフレッシュの間隔を設定する(デフォルト 15秒)
set -g status-interval 60
## ウィンドウリストの位置を中心寄せにする
set -g status-justify centre
## ヴィジュアルノーティフィケーションを有効にする
setw -g monitor-activity on
set -g visual-activity on

# --- AI開発環境用キーバインド ---
# 古い直接バインドを解除
unbind -n C-g
unbind -n C-f

# prefix + g: lazygit ポップアップ（幅90% 高さ90%）
bind g display-popup -E -w 90% -h 90% "lazygit"

# prefix + f: ファイルピッカー ポップアップ（呼び出し元ペインIDを渡す）
bind f display-popup -E -w 90% -h 90% \
  "~/.dotfiles/tmux/scripts/tmux-file-picker.sh #{pane_id}"
